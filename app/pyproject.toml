[project]
name = "robi"
version = "0.1.0"
description = "ROBI device app — настільний інтерактивний маскот"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "segno>=1.6",
    "websockets>=13",
    "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
robi = "robi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]

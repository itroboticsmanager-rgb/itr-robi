[project]
name = "robi"
version = "0.1.0"
description = "ROBI device app — настільний інтерактивний маскот"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "segno>=1.6",
    "websockets>=13",
    "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Необов'язково й навмисно (D-053): найважча залежність проєкту потрібна
# лише коли vision.backend = "camera". Headless-варіант не тягне Qt/GTK.
camera = ["opencv-python-headless>=4.10"]

[project.scripts]
robi = "robi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Модель YuNet їде разом з пакетом: пристрій не має ходити по неї в мережу
# під час старту (D-053, offline-стійкість).
[tool.setuptools.package-data]
"robi.vision" = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]

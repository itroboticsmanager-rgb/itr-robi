# Приклад конфігурації пристрою.
# Секрети сюди не потрапляють: CRM-токени встановлюються окремо під час
# provisioning і не зберігаються в Git (принцип 6 у README).

device_id = "robi-dev-01"
site = "reception"

[display]
# Вбудований екран Surface Go 2: 10.5", 1920x1280, 3:2 (D-040).
# Повороту на рівні системи не потрібно — застосунок працює в альбомній
# орієнтації напряму. Співвідношення 3:2 помітно "вище" за 16:9, тому
# геометрію обличчя перевіряти саме на цій роздільності.
width = 1920
height = 1280
fullscreen = false
target_fps = 60

[crm]
enabled = true
# Базова адреса; клієнт сам додає /ws і параметри token та channels.
url = "ws://127.0.0.1:8765"
# Числовий id пристрою в CRM: він же `sub` у токені й `<id>` у каналі
# `device:<id>` (D-056).
device_no = 1
# Пристрій зберігає ключ, а не перепустку. Токен CRM живе хвилини, тож у
# конфігурацію його класти безглуздо: застосунок сам обмінює секрет на
# свіжий токен перед кожним підключенням. Більше нічого не потрібно —
# сервер перевіряє токен на рукостисканні, а далі з'єднання живе.
token_url = "https://crm.itrobotics.com.ua/api/device/realtime-token"

# Файл із секретом пристрою. Окремо від цього конфігу навмисно: конфіг не
# соромно показати чи покласти в Git, а секрет — ні (принцип 6).
secret_path = "C:/ROBI/device-secret.txt"

# Готовий токен — лише для розробки проти fake_crm:
#   python app/tools/fake_crm.py --print-token --device 1
# У бойовому конфігу тут порожньо.
token = ""
reconnect_min_s = 1.0
reconnect_max_s = 30.0

# Allowlist перевіряється НА ПРИСТРОЇ, а не лише в CRM (D-038).
# Порожній allowed_domains придатний тільки для розробки: у production
# порожній список означає, що ROBI покаже будь-який домен, який попросить CRM.
allowed_url_schemes = ["https"]
# Кожен домен тут — це QR, який CRM уміє вивести на кіоск (D-059):
#   crm.itrobotics.com.ua       анкета, запрошення викладача й адміністратора
#   students.itrobotics.com.ua  картка учня, гостьова кімната
#   qr.bank.gov.ua              платіжний QR за стандартом НБУ
#   t.me                        прив'язка батьків до Telegram-бота
# t.me пропускає будь-яке посилання Telegram — це ціна прив'язки батьків;
# CRM будує лише посилання на бота школи.
# Список звіряє tests/unit/test_crm_url_contract.py: нова адреса в CRM без
# рядка тут означає, що кіоск її мовчки не покаже.
allowed_domains = [
  "crm.itrobotics.com.ua",
  "students.itrobotics.com.ua",
  "qr.bank.gov.ua",
  "t.me",
]

[vision]
# "fake" — записаний сценарій без камери, OpenCV не потрібен.
# "camera" — справжня камера пристрою; потребує extra `camera` (D-053).
backend = "fake"
device_index = 0
# Виміряно на пристрої (D-053): 8 к/с при 320 px коштували 74 % ядра й
# не встигали; 4 к/с при 224 px — 18 % при кращій детекції. 160 px уже
# завузько: половина облич губиться.
fps = 4.0
detect_width = 224
# Профіль обличчя вужчий за анфас, тож суворий фільтр губить людину саме
# тоді, коли вона повертається вбік — найчастіший рух біля стійки.
min_face_frac = 0.08
# Віддзеркалення горизонталі. Без нього погляд відводиться від людини:
# екран — картинка, а не співрозмовник.
mirror = true

# Сповільнення в спокої. Стійка порожня більшу частину доби, тож повна
# частота весь час — це детекція порожнього коридору цілодобово. Після
# idle_after_s без обличчя частота падає до idle_fps і миттєво
# повертається до повної, щойно когось видно.
idle_fps = 1.0
idle_after_s = 3.0

# Тихі години: поза ними камера не вмикається взагалі. Уночі й на
# вихідних дивитися нема на кого, а безвентиляторний планшет гріється —
# і всередині нього живе акумулятор. Однакові значення знімають
# обмеження; у коді за замовчуванням саме так, бо розклад є політикою
# розгортання, а не поведінкою бібліотеки.
active_from = "07:00"
active_to = "20:00"

[content]
# Контент-меню (D-048). Порожній path означає, що меню на цьому пристрої
# немає: mascot і qr працюють без нього, а команда CRM на `info` буде
# чесно відхилена як непідтримана.
path = "config/content.example.toml"
assets = "assets/content"
# Скільки меню чекає на дотик, перш ніж повернутися в mascot.
timeout_s = 45.0
# Меню з CRM: напрями й рівні, які адміністратор увімкнув у «Сайт → Кіоск
# ROBI». Той самий секрет пристрою, що й для банерів. Щойно CRM віддала
# перший набір, він важливіший за локальний path; порожній набір означає,
# що меню з CRM вимкнено, і локальний приклад на його місце не стає.
url = "https://crm.itrobotics.com.ua/api/device/content"
cache_dir = "C:/ROBI/cache/content"
refresh_s = 300.0

[banners]
# Вітрина (D-058). Банери беруться з CRM тим самим секретом пристрою, що
# й realtime-токен — це той самий пристрій із тим самим ключем.
url = "https://crm.itrobotics.com.ua/api/device/banners"
# Кеш обов'язковий, а не бажаний: мережа на рецепції ненадійна, а порожня
# вітрина об 8:30 — найгірший момент для «зараз нема зв'язку».
cache_dir = "C:/ROBI/cache/banners"
refresh_s = 900.0

[features]
camera = true
nfc = true
voice = false   # ще не реалізовано; конфігурація з true не пройде валідацію
rgb = true

[web]
# Локальна служба, з якої читає веб-інтерфейс. Інтерфейс переїжджає у веб,
# бо майстерня Робі — сцена на WebGL, а pygame малює у 2D без OpenGL і без
# вбудованого браузера: вивести її в поверхню застосунку неможливо.
#
# Вимкнена, доки веб-частина не доведена на самому планшеті. Поки прапорець
# знято, кіоск поводиться точно як раніше.
enabled = false
# Тільки петля. Пристрій стоїть у холі школи, де працює анкета з
# персональними даними батьків (D-049): зайвий порт назовні — це нова
# поверхня атаки без потреби. Інша адреса зупиняє старт, а не пишеться в лог.
host = "127.0.0.1"
port = 4173
# Тека зі зібраним інтерфейсом. Порожня — служба віддає лише API.
root = ""

# Приклад конфігурації пристрою.
# Секрети сюди не потрапляють: CRM-токени встановлюються окремо під час
# provisioning і не зберігаються в Git (принцип 6 у README).

device_id = "robi-dev-01"
site = "reception"

[display]
# Вбудований екран Surface Go 2: 10.5", 1920x1280, 3:2 (D-040).
# Повороту на рівні системи не потрібно — застосунок працює в альбомній
# орієнтації напряму. Співвідношення 3:2 помітно "вище" за 16:9, тому
# геометрію обличчя перевіряти саме на цій роздільності.
width = 1920
height = 1280
fullscreen = false
target_fps = 60

[crm]
enabled = true
url = "ws://127.0.0.1:8765"
reconnect_min_s = 1.0
reconnect_max_s = 30.0

# Allowlist перевіряється НА ПРИСТРОЇ, а не лише в CRM (D-038).
# Порожній allowed_domains придатний тільки для розробки: у production
# порожній список означає, що ROBI покаже будь-який домен, який попросить CRM.
allowed_url_schemes = ["https"]
allowed_domains = ["example.org"]

[vision]
# "fake" — записаний сценарій без камери, OpenCV не потрібен.
# "camera" — справжня камера пристрою; потребує extra `camera` (D-053).
backend = "fake"
device_index = 0
# Виміряно на пристрої (D-053): 8 к/с при 320 px коштували 74 % ядра й
# не встигали; 4 к/с при 224 px — 18 % при кращій детекції. 160 px уже
# завузько: половина облич губиться.
fps = 4.0
detect_width = 224
# Профіль обличчя вужчий за анфас, тож суворий фільтр губить людину саме
# тоді, коли вона повертається вбік — найчастіший рух біля стійки.
min_face_frac = 0.08
# Віддзеркалення горизонталі. Без нього погляд відводиться від людини:
# екран — картинка, а не співрозмовник.
mirror = true

[features]
camera = true
nfc = true
voice = false   # ще не реалізовано; конфігурація з true не пройде валідацію
rgb = true

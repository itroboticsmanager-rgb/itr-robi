# Приклад контент-меню (D-048).
#
# Це дані, а не розмітка: довільний HTML чи код звідси не виконується й
# виконуватись не може — застосунок сам вирішує, як показати вузол.
# Живе меню приходить із CRM (вкладка «Сайт → Кіоск ROBI») у тій самій
# структурі; цей файл діє, поки CRM ще не віддала жодного набору.
#
# Валідація сувора й падає на завантаженні: посилання в нікуди — це
# глухий кут перед батьком біля стійки, а не рядок у журналі.
#
# Підпис пункту меню береться із заголовка вузла, куди він веде. Окремого
# поля під підпис немає навмисно: дві назви однієї сторінки розходяться
# першої ж правки.
#
# Форма: корінь → напрями (menu) → курси (card). Напрями стають кнопками
# головної. Вік і тривалість — числа, підписи до них складає інтерфейс.

root = "root"

[[node]]
id = "root"
kind = "menu"
title = "Обрати заняття"
items = ["robotics", "modeling"]


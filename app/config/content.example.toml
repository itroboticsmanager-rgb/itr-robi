# Приклад контент-меню (D-048).
#
# Це дані, а не розмітка: довільний HTML чи код звідси не виконується й
# виконуватись не може — застосунок сам вирішує, як показати вузол.
# Коли з'явиться CRM, вона віддаватиме цю саму структуру.
#
# Валідація сувора й падає на завантаженні: посилання в нікуди — це
# глухий кут перед батьком біля стійки, а не рядок у журналі.
#
# Підпис пункту меню береться із заголовка вузла, куди він веде. Окремого
# поля під підпис немає навмисно: дві назви однієї сторінки розходяться
# першої ж правки.

root = "root"

[[node]]
id = "root"
kind = "menu"
title = "Чим можу допомогти?"
items = ["courses", "products"]

# --- курси ----------------------------------------------------------------

[[node]]
id = "courses"
kind = "menu"
title = "Курси"
items = ["course-3d", "course-robotics"]

[[node]]
id = "course-3d"
kind = "card"
title = "3D-моделювання"
price = "1200 грн / місяць"
body = """
Діти вчаться створювати власні моделі з нуля: від ідеї на папері до
готового друку. Заняття двічі на тиждень по півтори години, група до
восьми учнів. Потрібен лише інтерес — усе інше є в класі.
"""
image = "courses/3d.webp"

[[node]]
id = "course-robotics"
kind = "card"
title = "Робототехніка"
price = "1400 грн / місяць"
body = """
Складання й програмування роботів. Починаємо з готових наборів,
до кінця року діти пишуть власні алгоритми руху й реакції на
датчики. Вік від дев'яти років.
"""
image = "courses/robotics.webp"

# --- товари ---------------------------------------------------------------

[[node]]
id = "products"
kind = "menu"
title = "Що можна замовити"
items = ["product-keychain"]

[[node]]
id = "product-keychain"
kind = "card"
title = "Брелок з друком"
price = "150 грн"
body = """
Друкуємо на замовлення в кольорі на вибір. Готовий за два дні,
забирати на рецепції.
"""
image = "products/keychain.webp"

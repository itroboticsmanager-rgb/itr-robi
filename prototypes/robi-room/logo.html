<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лого на стіні · перегляд</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font: 15px/1.4 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; background: #eef3f9; color: #16324f; }
      main { display: grid; gap: 16px; padding: 20px; }
      .frame { position: relative; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 34px rgba(16, 47, 82, .18); }
      canvas { display: block; width: 100%; height: 100%; }
      .window { aspect-ratio: 1920 / 384; }
      .panel { aspect-ratio: 1920 / 640; }
      .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 1px solid #b9cbe0; background: #fff; color: inherit; cursor: pointer; }
      button[aria-pressed="true"] { background: #16324f; color: #fff; border-color: #16324f; }
      .scenes { display: inline-flex; gap: 6px; }
      .scenes button { padding: 6px 10px; font-size: 13px; }
      output { font-variant-numeric: tabular-nums; color: #4a668a; }
      h2 { margin: 0; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #5b7a9c; }
    </style>
  </head>
  <body>
    <main>
      <div class="controls">
        <button id="theme" aria-pressed="true">Темна стіна</button>
        <button id="sweep">Прогін світла</button>
        <span id="scenes" class="scenes"></span>
        <button id="pause" aria-pressed="false">Пауза</button>
        <label>Момент <input id="scrub" type="range" min="0" max="100" value="0" aria-label="Момент сцени"></label>
        <output id="stats">—</output>
      </div>
      <div class="frame window"><canvas id="stage-window"></canvas></div>
      <div class="frame panel"><canvas id="panel"></canvas></div>
    </main>
    <script type="module" src="/src/logo-preview.js"></script>
  </body>
</html>
